<!doctype html>
<html>
<head>
    <title>{% block title %}Secure Registration{% endblock %}</title>
</head>

<body>
    <!--Display any existing flash messages-->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
        {% for category, message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
